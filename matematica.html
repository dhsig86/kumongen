<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>KumonGen · Matemática</title>
    <link rel="stylesheet" href="tailwind.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="KumonGen">
    <meta name="description" content="KumonGen — Gerador gratuito de cadernos de exercícios personalizados de Matemática para crianças. Imprima folhas A4 com atividades progressivas.">
    <meta property="og:title" content="KumonGen · Matemática">
    <meta property="og:description" content="Gere cadernos de exercícios de Matemática personalizados para impressão.">
    <link rel="stylesheet" href="kumon.css">
</head>
<body class="bg-slate-900 font-sans antialiased h-screen flex flex-col md:flex-row">

<!-- SIDEBAR COM GRADIENTE AZUL E BRANCO -->
<aside class="no-print w-full md:w-80 bg-white shadow-2xl flex flex-col z-20 text-slate-800 overflow-y-auto">
    <div class="p-6 bg-gradient-to-br from-blue-600 to-blue-400 text-white">
        <h1 class="text-xl font-black flex items-center gap-2">
            <i class="fas fa-calculator"></i> KUMON·MAT <span class="text-blue-200 text-xs ml-1">v2</span>
        </h1>
        <p class="text-[10px] uppercase tracking-widest font-bold opacity-80">matemática personalizável</p>
    </div>

    <div class="flex-1 p-5 space-y-6">
        <!-- Link voltar -->
        <div class="flex items-center justify-between text-xs text-blue-600">
            <a href="index.html" class="hover:underline flex items-center gap-1"><i class="fas fa-arrow-left"></i> Início</a>
            <div class="flex items-center gap-3">
                <a href="https://www.paypal.com/donate/?hosted_button_id=33K7CJ2EQELNU" target="_blank" rel="noopener noreferrer" class="text-pink-500 hover:text-pink-600 transition-colors" title="Apoie este projeto" aria-label="Apoie este projeto"><i class="fas fa-heart"></i></a>
                <button onclick="KumonGen_showTutorialModal()" class="hover:underline flex items-center gap-1 font-bold text-slate-500 hover:text-blue-600"><i class="fas fa-question-circle"></i> Tutorial</button>
            </div>
        </div>
        <div class="flex gap-1 mt-2">
            <span class="flex-1 text-center text-[10px] font-black py-1 rounded bg-blue-100 text-blue-700">MAT</span>
            <a href="portugues.html" class="flex-1 text-center text-[10px] font-bold py-1 rounded bg-slate-100 text-slate-500 hover:bg-green-100 hover:text-green-700 transition-colors">POR</a>
            <a href="ingles.html" class="flex-1 text-center text-[10px] font-bold py-1 rounded bg-slate-100 text-slate-500 hover:bg-red-100 hover:text-red-700 transition-colors">ENG</a>
        </div>

        <!-- Scoreboard Widget -->
        <div id="scoreboardWidget"></div>

        <!-- Níveis -->
        <div>
            <label class="text-[10px] font-black text-slate-400 uppercase block mb-3">nível</label>
            <div id="levelList" class="space-y-2 max-h-64 overflow-y-auto pr-1"></div>
        </div>

        <!-- Visual / repetição -->
        <div>
            <label class="text-[10px] font-black text-slate-400 uppercase block mb-3">visual</label>
            <div class="bg-slate-50 p-3 rounded-xl space-y-3">
                <div class="flex items-center justify-between">
                    <label for="linesPerPage" class="text-xs">linhas/página</label>
                    <select id="linesPerPage" class="border rounded px-2 py-1 text-xs">
                        <option value="6">6</option>
                        <option value="8" selected>8</option>
                        <option value="10">10</option>
                        <option value="12">12</option>
                    </select>
                </div>
                <div class="flex items-center justify-between">
                    <label for="pagesPerBook" class="text-xs">páginas/caderno</label>
                    <select id="pagesPerBook" class="border rounded px-2 py-1 text-xs">
                        <option value="2" selected>2 págs (1 folha)</option>
                        <option value="4">4 págs (2 folhas)</option>
                        <option value="6">6 págs (3 folhas)</option>
                        <option value="8">8 págs (4 folhas)</option>
                    </select>
                </div>
                <div class="flex items-center justify-between">
                    <span class="text-xs">zoom</span>
                    <div class="flex items-center gap-2">
                        <button onclick="adjustZoom(-0.1)" class="bg-white border w-6 h-6 rounded" aria-label="Diminuir zoom"><i class="fas fa-minus"></i></button>
                        <span id="zoomValue" class="text-xs font-mono w-12 text-center">70%</span>
                        <button onclick="adjustZoom(0.1)" class="bg-white border w-6 h-6 rounded" aria-label="Aumentar zoom"><i class="fas fa-plus"></i></button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Parâmetros dinâmicos -->
        <div>
            <label class="text-[10px] font-black text-slate-400 uppercase block mb-3">parâmetros</label>
            <div id="paramPanel" class="bg-slate-50 p-3 rounded-xl min-h-[100px] text-xs"></div>
        </div>

        <!-- Ações -->
        <div class="border-t border-slate-100 pt-4 space-y-2">
            <button onclick="refreshPreview()" class="w-full flex items-center justify-center gap-2 bg-blue-600 text-white p-3 rounded-xl hover:bg-blue-700 font-bold text-sm shadow">
                <i class="fas fa-sync-alt"></i> atualizar preview
            </button>
            <button onclick="generatePDF()" class="w-full flex items-center justify-center gap-2 bg-blue-500 text-white p-4 rounded-xl hover:bg-blue-600 shadow-lg font-black text-sm">
                <i class="fas fa-file-pdf"></i> GERAR PDF
            </button>
        </div>
        <div class="text-center text-[8px] text-slate-400 pt-4 border-t border-slate-100">
            By Dr. Dario Hart — Free Use 2026
        </div>
    </div>
</aside>

<!-- Botão mobile para scroll até o preview -->
<div class="md:hidden no-print sticky top-0 z-10 bg-slate-800/90 backdrop-blur-sm p-2 text-center">
    <button onclick="document.getElementById('previewContainer').scrollIntoView({behavior:'smooth'})" class="text-xs text-slate-300 hover:text-white font-bold py-1 px-4 rounded-full bg-slate-700 hover:bg-slate-600 transition-colors">
        <i class="fas fa-eye"></i> Ver Preview ↓
    </button>
</div>

<!-- PREVIEW (A4 paisagem) -->
<main class="flex-1 overflow-auto bg-[#0F172A] flex items-start justify-center p-8 no-print" id="previewContainer">
    <div id="zoomContainer" class="transition-transform duration-200 origin-top" style="transform:scale(0.7)">
        <div id="a4-sheet" class="bg-white shadow-2xl flex relative">
            <div class="dashed-center-line"></div>
            <div id="pageLeft" class="page page-left"></div>
            <div id="pageRight" class="page"></div>
        </div>
    </div>
</main>

<!-- Scripts -->
<script src="gerador.js"></script>
<script src="matematica.js"></script>

<script>
    window.addEventListener('resize', KumonGen.adjustPreviewScale);
    window.addEventListener('load', KumonGen.adjustPreviewScale);
    // Também ajusta quando mudar o zoom ou interagir
    document.addEventListener('DOMContentLoaded', KumonGen.adjustPreviewScale);

    // Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('[KumonGen] SW registrado:', reg.scope))
          .catch(err => console.error('[KumonGen] SW falhou:', err));
      });
    }
</script>

</body>
</html>
